</head>

<div class="game-wrapper">

<script>
    let score = 0, currentIndex = 0, answered = false, userAnswer = null;

    const CHAPTERS = [
        { id:1, title:"🔬 Capítulo 1: O Mundo Microscópico da Dilatação", character:"Prof. Átomos", avatar:"⚛️🔬", speech:"Quando aquecemos um material, suas partículas vibram mais e se afastam! É isso que causa a dilatação!",
          theory:`<div class="theory-box"><div class="theory-title">📖 DILATAÇÃO EM TERMOS MICROSCÓPICOS</div><div class="theory-content">Os átomos e moléculas de um material vibram constantemente. Quando a temperatura aumenta, a energia cinética média das partículas aumenta, fazendo com que elas vibrem com maior amplitude. Isso aumenta a distância média entre elas, causando a DILATAÇÃO do corpo.<br><br>🔹 Quanto maior a temperatura → maior vibração → maior espaçamento → maior volume.<br>🔹 Materiais diferentes dilatam de formas diferentes devido à intensidade das forças interatômicas.</div><div class="formula-box">💡 Dica: A dilatação ocorre em todas as direções!</div></div>`,
          text:"O que acontece com as partículas de um material quando ele é aquecido?",
          options:["Elas param de se mover","Elas vibram mais intensamente e se afastam","Elas se aproximam umas das outras","Elas se transformam em outro material"], correct:1,
          explanation:"✅ Quando a temperatura aumenta, a energia cinética das partículas aumenta, elas vibram mais e a distância média entre elas aumenta, causando dilatação." },
        { id:2, title:"📏 Capítulo 2: Dilatação Linear", character:"Engenheiro das Barras", avatar:"📏🔧", speech:"Para barras e fios, a dilatação acontece principalmente no comprimento!",
          theory:`<div class="theory-box"><div class="theory-title">📖 DILATAÇÃO LINEAR (ΔL = L₀ · α · ΔT)</div><div class="theory-content"><strong>Fórmula:</strong> ΔL = L₀ · α · ΔT<br>• ΔL = variação do comprimento<br>• L₀ = comprimento inicial<br>• α = coeficiente de dilatação linear (depende do material)<br>• ΔT = variação de temperatura (T_final - T_inicial)<br><br>🔹 Exemplo: O coeficiente do ferro é 1,2×10⁻⁵ °C⁻¹.</div></div>`,
          text:"Uma barra de ferro tem comprimento inicial de 10 m e sofre uma variação de temperatura de 50°C. (α = 1,2×10⁻⁵ °C⁻¹). Qual é a dilatação linear?",
          options:["0,006 m","0,06 m","0,6 m","0,012 m"], correct:0,
          explanation:"✅ ΔL = L₀·α·ΔT = 10 × 1,2×10⁻⁵ × 50 = 10 × 60×10⁻⁵ = 600×10⁻⁵ = 0,006 m." },
        { id:3, title:"🟦 Capítulo 3: Dilatação Superficial", character:"Mestra das Chapas", avatar:"🟦📐", speech:"Chapas e superfícies dilatam em duas direções! Área também aumenta!",
          theory:`<div class="theory-box"><div class="theory-title">📖 DILATAÇÃO SUPERFICIAL (ΔA = A₀ · β · ΔT)</div><div class="theory-content"><strong>Fórmula:</strong> ΔA = A₀ · β · ΔT<br>• β = 2α (coeficiente de dilatação superficial)<br>• A₀ = área inicial<br>• ΔT = variação de temperatura<br><br>🔹 A dilatação superficial é usada para placas, lâminas e superfícies planas.</div></div>`,
          text:"Uma chapa de alumínio tem área inicial 2 m² e coeficiente α = 2,4×10⁻⁵ °C⁻¹. Aquecida em 100°C, qual a dilatação superficial? (β = 2α)",
          options:["4,8×10⁻³ m²","9,6×10⁻³ m²","2,4×10⁻³ m²","1,2×10⁻³ m²"], correct:1,
          explanation:"✅ β = 2α = 4,8×10⁻⁵ °C⁻¹. ΔA = A₀·β·ΔT = 2 × 4,8×10⁻⁵ × 100 = 2 × 4,8×10⁻³ = 9,6×10⁻³ m²." },
        { id:4, title:"🧊 Capítulo 4: Dilatação Volumétrica", character:"Doutor Volume", avatar:"🧊📦", speech:"Sólidos dilatam em todas as direções! Volume também aumenta com o calor!",
          theory:`<div class="theory-box"><div class="theory-title">📖 DILATAÇÃO VOLUMÉTRICA (ΔV = V₀ · γ · ΔT)</div><div class="theory-content"><strong>Fórmula:</strong> ΔV = V₀ · γ · ΔT<br>• γ = 3α (coeficiente de dilatação volumétrica)<br>• V₀ = volume inicial<br>• ΔT = variação de temperatura<br><br>🔹 Para sólidos isotrópicos, γ = 3α.</div></div>`,
          text:"Um bloco de cobre tem volume 0,5 m³, α = 1,7×10⁻⁵ °C⁻¹. Aquecido em 200°C, qual a variação de volume? (γ = 3α)",
          options:["5,1×10⁻³ m³","2,55×10⁻³ m³","1,7×10⁻³ m³","3,4×10⁻³ m³"], correct:0,
          explanation:"✅ γ = 3×1,7×10⁻⁵ = 5,1×10⁻⁵ °C⁻¹. ΔV = 0,5 × 5,1×10⁻⁵ × 200 = 0,5 × 1,02×10⁻² = 5,1×10⁻³ m³." },
        { id:5, title:"💧 Capítulo 5: Dilatação dos Líquidos", character:"Professora Líquida", avatar:"💧🧪", speech:"Os líquidos dilatam mais que os sólidos! Mas precisamos considerar o recipiente!",
          theory:`<div class="theory-box"><div class="theory-title">📖 DILATAÇÃO DOS LÍQUIDOS - REAL E APARENTE</div><div class="theory-content"><strong>Dilatação Real:</strong> É a dilatação verdadeira do líquido, considerando que o recipiente também dilata.<br><strong>Dilatação Aparente:</strong> É a dilatação que observamos (ΔV_ap = V₀ · γ_ap · ΔT).<br><br>🔹 γ_real = γ_ap + γ_recipiente<br>🔹 γ_ap = γ_real - γ_recipiente</div><div class="formula-box">💡 Líquidos dilatam mais que sólidos: γ_líquido > γ_sólido</div></div>`,
          text:"O que é dilatação APARENTE de um líquido?",
          options:["É a dilatação real do líquido","É a dilatação que observamos, já descontando a dilatação do recipiente","É a dilatação do recipiente","Não tem relação com a dilatação"], correct:1,
          explanation:"✅ Dilatação aparente é a variação de volume do líquido que conseguimos observar, pois o recipiente também se dilata." },
        { id:6, title:"💧💎 Capítulo 6: Dilatação Real e Aparente - Exercício", character:"Detetive dos Frascos", avatar:"🔍🧪", speech:"Vamos calcular! A dilatação real é a soma da aparente com a do recipiente.",
          theory:`<div class="theory-box"><div class="theory-title">📖 DILATAÇÃO REAL = APARENTE + DO RECIPIENTE</div><div class="theory-content">γ_real = γ_ap + γ_recipiente<br>ΔV_real = ΔV_ap + ΔV_recipiente<br><br>Exemplo: Um frasco de vidro (γ_vidro = 2,7×10⁻⁵ °C⁻¹) contém um líquido com γ_real = 1,1×10⁻⁴ °C⁻¹. A dilatação aparente será: γ_ap = γ_real - γ_vidro = 1,1×10⁻⁴ - 2,7×10⁻⁵ = 8,3×10⁻⁵ °C⁻¹.</div></div>`,
          text:"Um líquido tem γ_real = 9×10⁻⁴ °C⁻¹. O recipiente de vidro tem γ = 3×10⁻⁵ °C⁻¹. Qual o coeficiente de dilatação aparente do líquido?",
          options:["8,7×10⁻⁴ °C⁻¹","9,3×10⁻⁴ °C⁻¹","6×10⁻⁴ °C⁻¹","12×10⁻⁴ °C⁻¹"], correct:0,
          explanation:"✅ γ_ap = γ_real - γ_recipiente = 9×10⁻⁴ - 3×10⁻⁵ = 8,7×10⁻⁴ °C⁻¹." },
        { id:7, title:"💧❄️ Capítulo 7: O Comportamento Anômalo da Água", character:"Sábia da Água", avatar:"💧❄️", speech:"A água é especial! Entre 0°C e 4°C, ela se comporta de forma diferente de todas as outras substâncias!",
          theory:`<div class="theory-box"><div class="theory-title">📖 COMPORTAMENTO ANÔMALO DA ÁGUA</div><div class="theory-content"><strong>Anomalia da água:</strong> Entre 0°C e 4°C, a água CONTRAI quando é aquecida! A densidade máxima ocorre a 4°C (1,000 g/cm³).<br><br>🔹 0°C → gelo (menos denso, flutua)<br>🔹 4°C → densidade máxima<br>🔹 Acima de 4°C → dilatação normal<br><br>🌊 Esse fenômeno é vital para a vida aquática! O gelo forma uma camada isolante na superfície, protegendo os organismos no fundo.</div><div class="formula-box">💡 Gelo flutua porque sua densidade é menor que a da água líquida (0,92 g/cm³).</div></div>`,
          text:"Em que temperatura a água atinge sua densidade MÁXIMA?",
          options:["0°C","4°C","10°C","100°C"], correct:1,
          explanation:"✅ A 4°C a água tem densidade máxima (1,000 g/cm³). Entre 0°C e 4°C, ela se contrai ao ser aquecida, comportamento anômalo." },
        { id:8, title:"🧊❄️ Capítulo 8: Por que o gelo flutua?", character:"Explorador Polar", avatar:"🧊🐧", speech:"Se o gelo afundasse, os lagos congelariam do fundo para a superfície! A vida seria impossível!",
          theory:`<div class="theory-box"><div class="theory-title">📖 IMPORTÂNCIA DO COMPORTAMENTO ANÔMALO</div><div class="theory-content">• A 0°C, o gelo tem densidade 0,92 g/cm³, menor que a água líquida.<br>• Por isso o gelo flutua, formando uma camada isolante.<br>• Isso permite que a vida subaquática sobreviva no inverno.<br>• Se a água se comportasse como outros líquidos, lagos congelariam solidamente, inviabilizando a vida.</div></div>`,
          text:"Por que o gelo flutua na água?",
          options:["Porque é mais denso","Porque é menos denso que a água líquida","Porque tem ar dentro","Porque é mais pesado"], correct:1,
          explanation:"✅ O gelo tem densidade menor (0,92 g/cm³) que a água líquida (1,00 g/cm³ a 4°C), por isso flutua." },
        { id:9, title:"🔧 Capítulo 9: Exercício Resolvido - Dilatação Linear", character:"Mestre dos Cálculos", avatar:"🧮🔧", speech:"Vamos resolver juntos! Acompanhe o passo a passo.",
          theory:`<div class="theory-box"><div class="theory-title">📖 EXERCÍCIO RESOLVIDO</div><div class="theory-content"><strong>Problema:</strong> Uma barra de aço (α = 1,1×10⁻⁵ °C⁻¹) tem 20 m a 20°C. Qual será seu comprimento a 70°C?<br><br><strong>Resolução:</strong><br>ΔT = 70 - 20 = 50°C<br>ΔL = L₀·α·ΔT = 20 × 1,1×10⁻⁵ × 50 = 20 × 55×10⁻⁵ = 1100×10⁻⁵ = 0,011 m<br>L = L₀ + ΔL = 20 + 0,011 = 20,011 m</div></div>`,
          text:"Uma barra de aço (α=1,1×10⁻⁵) de 20 m a 20°C é aquecida a 70°C. Qual o comprimento final?",
          options:["20,011 m","20,022 m","20,0055 m","20,044 m"], correct:0,
          explanation:"✅ ΔL = 20 × 1,1×10⁻⁵ × 50 = 0,011 m → L = 20 + 0,011 = 20,011 m." },
        { id:10, title:"📐 Capítulo 10: Exercício - Dilatação Superficial", character:"Arquiteta Térmica", avatar:"🏗️📏", speech:"Placas metálicas dilatam! Calcule a nova área.",
          text:"Uma placa de cobre (α=1,7×10⁻⁵) tem área 0,5 m² a 30°C. Aquecida a 130°C, qual a variação de área?",
          options:["1,7×10⁻³ m²","3,4×10⁻³ m²","8,5×10⁻³ m²","1,02×10⁻² m²"], correct:0,
          explanation:"✅ β=2α=3,4×10⁻⁵. ΔA = 0,5 × 3,4×10⁻⁵ × 100 = 0,5 × 3,4×10⁻³ = 1,7×10⁻³ m²." },
        { id:11, title:"🧪 Capítulo 11: Exercício - Dilatação Volumétrica", character:"Químico das Escalas", avatar:"⚗️📊", speech:"Volume também se dilata! Vamos praticar.",
          text:"Um cubo de alumínio (α=2,4×10⁻⁵) tem volume 1 m³ a 0°C. Aquecido a 100°C, qual o volume final? (γ=3α)",
          options:["1,0072 m³","1,0024 m³","1,0048 m³","1,0096 m³"], correct:0,
          explanation:"✅ γ=7,2×10⁻⁵. ΔV = 1 × 7,2×10⁻⁵ × 100 = 7,2×10⁻³ m³. V=1+0,0072=1,0072 m³." },
        { id:12, title:"💧 Capítulo 12: Exercício - Dilatação de Líquidos", character:"Mestre dos Líquidos", avatar:"💧📈", speech:"Líquidos dilatam mais! Vamos calcular a dilatação real.",
          text:"Um líquido com γ=1,2×10⁻³ °C⁻¹ ocupa 2 L a 20°C. Aquecido a 80°C, qual o aumento de volume?",
          options:["0,144 L","0,072 L","0,288 L","0,036 L"], correct:0,
          explanation:"✅ ΔV = V₀·γ·ΔT = 2 × 1,2×10⁻³ × 60 = 2 × 72×10⁻³ = 0,144 L." },
        { id:13, title:"❄️ Capítulo 13: Recapitulação - Conceitos Fundamentais", character:"Professor Revisão", avatar:"📚🔄", speech:"Hora de revisar! Vamos testar seus conhecimentos gerais.",
          theory:`<div class="theory-box"><div class="theory-title">📖 RECAPITULAÇÃO RÁPIDA</div><div class="theory-content">• Dilatação LINEAR: ΔL = L₀·α·ΔT<br>• Dilatação SUPERFICIAL: ΔA = A₀·β·ΔT (β=2α)<br>• Dilatação VOLUMÉTRICA: ΔV = V₀·γ·ΔT (γ=3α)<br>• Líquidos: γ_real = γ_ap + γ_recipiente<br>• Água: densidade máxima a 4°C, gelo menos denso</div></div>`,
          text:"Qual a relação entre os coeficientes de dilatação linear (α), superficial (β) e volumétrico (γ)?",
          options:["β=2α, γ=3α","β=α, γ=2α","β=3α, γ=2α","β=α/2, γ=α/3"], correct:0,
          explanation:"✅ Para sólidos isotrópicos: β = 2α e γ = 3α." },
        { id:14, title:"🌊 Capítulo 14: Recapitulação - Água", character:"Guardiã dos Oceanos", avatar:"🌊💙", speech:"A água tem propriedades únicas! Vamos revisar.",
          text:"Qual fenômeno permite que peixes sobrevivam em lagos congelados no inverno?",
          options:["Alta condutividade térmica","Comportamento anômalo da água (gelo menos denso flutua)","Baixo calor específico","Grande dilatação"], correct:1,
          explanation:"✅ O gelo flutua e forma uma camada isolante, protegendo a água líquida abaixo." },
        { id:15, title:"🏆 Capítulo 15: Teste Final - Dilatação Linear", character:"Avaliador Master", avatar:"🏆📝", speech:"Teste final! Mostre que você aprendeu!",
          text:"Uma ponte de concreto (α=1×10⁻⁵) tem 200 m de comprimento. Variação de temperatura de 30°C. Qual a dilatação?",
          options:["0,06 m","0,6 m","0,006 m","6 m"], correct:0,
          explanation:"✅ ΔL = 200 × 1×10⁻⁵ × 30 = 200 × 3×10⁻⁴ = 6×10⁻² = 0,06 m." },
        { id:16, title:"🏆 Capítulo 16: Teste Final - Dilatação Volumétrica", character:"Avaliadora Volume", avatar:"📦🏆", speech:"Último desafio de sólidos!",
          text:"Uma esfera de ferro (α=1,2×10⁻⁵) tem volume 0,1 m³ a 20°C. Aquecida a 120°C, qual o volume final? (γ=3α)",
          options:["0,10036 m³","0,10072 m³","0,10108 m³","0,10018 m³"], correct:0,
          explanation:"✅ γ=3,6×10⁻⁵. ΔV=0,1×3,6×10⁻⁵×100=3,6×10⁻⁴ m³. V=0,1+0,00036=0,10036 m³." },
        { id:17, title:"🏆 Capítulo 17: Teste Final - Líquidos", character:"Mestre dos Fluidos", avatar:"💧🏆", speech:"Desafio com líquidos!",
          text:"Um frasco de vidro (γ=3×10⁻⁵) contém 1 L de mercúrio (γ_real=1,8×10⁻⁴). Qual a dilatação aparente para ΔT=50°C?",
          options:["7,5×10⁻³ L","9×10⁻³ L","1,5×10⁻³ L","3×10⁻³ L"], correct:0,
          explanation:"✅ γ_ap = γ_real - γ_vidro = 1,8×10⁻⁴ - 3×10⁻⁵ = 1,5×10⁻⁴. ΔV_ap = 1 × 1,5×10⁻⁴ × 50 = 7,5×10⁻³ L." },
        { id:18, title:"🏆 Capítulo 18: Teste Final - Anomalia da Água", character:"Sábia da Natureza", avatar:"❄️💧", speech:"Questão clássica sobre a água!",
          text:"Por que a água é essencial para a vida nos lagos durante o inverno?",
          options:["Seu alto calor específico","Comportamento anômalo - gelo isola a água líquida","Sua transparência","Sua pressão de vapor"], correct:1,
          explanation:"✅ O gelo flutua e isola a água abaixo, permitindo vida aquática mesmo com temperatura abaixo de zero." },
        { id:19, title:"📝 Capítulo 19: Desafio Integrado", character:"Desafiador Final", avatar:"🧩🏆", speech:"Último desafio! Integre tudo que aprendeu!",
          text:"Uma placa de alumínio (α=2,4×10⁻⁵) tem área 1 m² a 20°C. Se a temperatura sobe para 70°C, qual a nova área? (β=2α)",
          options:["1,0024 m²","1,0048 m²","1,0012 m²","1,0036 m²"], correct:0,
          explanation:"✅ β=4,8×10⁻⁵. ΔA=1×4,8×10⁻⁵×50=2,4×10⁻³ m². A=1+0,0024=1,0024 m²." },
        { id:20, title:"🎓 Capítulo 20: Certificado do Mestre Térmico", character:"Grande Mestre da Física", avatar:"🎓🔥", speech:"Parabéns! Você completou a jornada da dilatação térmica!",
          theory:`<div class="theory-box"><div class="theory-title">📖 PARABÉNS! VOCÊ APRENDEU:</div><div class="theory-content">✓ Dilatação microscópica<br>✓ Dilatação linear, superficial e volumétrica<br>✓ Coeficientes α, β, γ e relações<br>✓ Dilatação real e aparente de líquidos<br>✓ Comportamento anômalo da água<br>✓ Exercícios resolvidos e testes!</div></div>`,
          text:"O que acontece com a densidade da água entre 0°C e 4°C quando a temperatura aumenta?",
          options:["Aumenta","Diminui","Permanece constante","Zera"], correct:0,
          explanation:"✅ Entre 0°C e 4°C, a água se contrai ao ser aquecida, então sua densidade AUMENTA até atingir o máximo a 4°C." }
    ];

    const totalQuestions = CHAPTERS.length;
    const gameContent = document.getElementById("gameContent");
    const scoreSpan = document.getElementById("scoreValue");
    const currentQSpan = document.getElementById("currentQ");
    const totalQSpan = document.getElementById("totalQ");

    function updateUI() { scoreSpan.textContent = score; currentQSpan.textContent = currentIndex+1; totalQSpan.textContent = totalQuestions; }

    function render() {
        if(currentIndex >= totalQuestions) { renderResult(); return; }
        const ch = CHAPTERS[currentIndex];
        const letters = ["A","B","C","D"];
        let theoryHtml = ch.theory ? ch.theory : '';
        let optionsHtml = ch.options.map((opt,idx)=>`<div class="option-comic" data-opt-index="${idx}"><div class="option-number">${letters[idx]}</div><div>${escapeHtml(opt)}</div></div>`).join('');
        let feedbackHtml = answered ? `<div class="feedback-comic ${userAnswer===ch.correct?'correct':'incorrect'}">${userAnswer===ch.correct?"✅✨ ACERTOU! ✨✅":"❌💔 VAMOS REVISAR! 💔❌"}<br><strong>${ch.explanation}</strong>${userAnswer!==ch.correct?`<br><br>📖 <strong>Resposta correta:</strong> ${ch.options[ch.correct]}`:''}</div>` : '';
        const html = `<div class="comic-panel"><div class="character"><div class="character-avatar">${ch.avatar}</div><div><div class="character-name">${ch.character}</div><div class="speech-bubble">"${ch.speech}"</div></div></div>${theoryHtml}<div class="question-box">📖 <strong>${ch.title}</strong><br>${escapeHtml(ch.text)}</div><div class="options-comic">${optionsHtml}</div>${feedbackHtml}<button class="next-btn" id="nextBtn" ${!answered?'disabled':''}>▶ Próximo Capítulo ▶</button></div>`;
        gameContent.innerHTML = html;
        if(!answered) document.querySelectorAll(".option-comic").forEach(opt=>opt.addEventListener("click",()=>{if(!answered){const idx=parseInt(opt.dataset.optIndex); handleAnswer(idx,ch);}}));
        document.getElementById("nextBtn")?.addEventListener("click",nextChapter);
    }

    function handleAnswer(selectedIdx,ch){ if(answered) return; answered=true; userAnswer=selectedIdx; if(selectedIdx===ch.correct) score++; updateUI(); render(); }
    function nextChapter(){ if(!answered) return; currentIndex++; answered=false; userAnswer=null; render(); }
    function renderResult(){
        const percent = (score/totalQuestions)*100;
        let msg = percent>=80?"🏆 MESTRE DA DILATAÇÃO! 🏆": percent>=60?"📚 GUARDIÃO TÉRMICO! 📚":"🌱 APRENDIZ EM EXPANSÃO! 🌱";
        const html = `<div class="comic-panel result-panel"><div style="font-size:3rem;">🔥🧊📏</div><h2>${msg}</h2><div style="background:#2c1810;border-radius:30px;padding:10px;margin:20px 0;"><div class="score-bar" style="width:${percent}%;">${score}/${totalQuestions} acertos</div></div><p>${percent>=80?"Excelente! Você domina dilatação térmica!":percent>=60?"Muito bem! Revise os conceitos de dilatação aparente e anomalia da água.":"Revise os capítulos sobre fórmulas e comportamento da água!"}</p><button class="restart-btn" id="restartBtn">🔥 Recomeçar Estudo 🔥</button><div class="summary-box"><strong>📚 FÓRMULAS ESSENCIAIS:</strong><br>• Linear: ΔL = L₀·α·ΔT<br>• Superficial: ΔA = A₀·2α·ΔT<br>• Volumétrica: ΔV = V₀·3α·ΔT<br>• Líquidos: γ_real = γ_ap + γ_recipiente<br>• Água: densidade máxima a 4°C</div></div>`;
        gameContent.innerHTML = html;
        document.getElementById("restartBtn")?.addEventListener("click",()=>{ score=0; currentIndex=0; answered=false; userAnswer=null; updateUI(); render(); });
    }
    function escapeHtml(str){ if(!str) return ""; return str.replace(/[&<>]/g,function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    totalQSpan.textContent = totalQuestions;
    render();
</script>
