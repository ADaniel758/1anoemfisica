<script>
    let score = 0, currentIndex = 0, answered = false, userAnswer = null;

    const CHAPTERS = [
        { id:1, title:"🔥 Capítulo 1: O que é Calor?", character:"Mestre do Fogo", avatar:"🔥🧠", speech:"Calor não é a mesma coisa que temperatura! Calor é energia EM TRÂNSITO!",
          theory:`<div class="theory-box"><div class="theory-title">📖 CONCEITO DE CALOR</div><div class="theory-content"><strong>Calor</strong> é a energia térmica em trânsito, que flui espontaneamente de um corpo de maior temperatura para outro de menor temperatura.<br><br>🔹 Calor NÃO é algo que um corpo "tem" – ele flui entre corpos!<br>🔹 Unidade no SI: Joule (J). Na prática, usamos também caloria (cal).<br>🔹 1 cal = 4,18 J</div><div class="formula-box">💡 Lembre-se: Calor é energia em movimento!</div></div>`,
          text:"Qual a definição correta de CALOR na Física?",
          options:["É a mesma coisa que temperatura","É a energia térmica armazenada em um corpo","É a energia térmica em trânsito entre corpos","É a energia cinética média das moléculas"], correct:2,
          explanation:"✅ Calor é a energia térmica em trânsito, que flui de um corpo mais quente para outro mais frio." },
        { id:2, title:"🌡️ Capítulo 2: Calor Sensível", character:"Sensível Sábio", avatar:"🌡️📈", speech:"Quando aquecemos algo e a temperatura AUMENTA, estamos fornecendo calor SENSÍVEL!",
          theory:`<div class="theory-box"><div class="theory-title">📖 CALOR SENSÍVEL (Q = m·c·ΔT)</div><div class="theory-content"><strong>Calor sensível</strong> é a energia que causa variação de TEMPERATURA em um corpo, sem mudar seu estado físico.<br><br>🔹 Fórmula: Q = m · c · ΔT<br>• Q = quantidade de calor (cal ou J)<br>• m = massa (g ou kg)<br>• c = calor específico (cal/g°C ou J/kg°C)<br>• ΔT = variação de temperatura (°C ou K)</div><div class="formula-box">📌 Exemplo: Aquecer água de 20°C para 40°C → calor sensível</div></div>`,
          text:"O que caracteriza o CALOR SENSÍVEL?",
          options:["Mudança de estado físico","Variação de temperatura","Variação de pressão","Mudança de volume"], correct:1,
          explanation:"✅ Calor sensível causa variação de temperatura, mantendo o estado físico." },
        { id:3, title:"💧 Capítulo 3: Calor Latente", character:"Transformador de Estados", avatar:"💧💨", speech:"Quando a água vira vapor ou gelo vira água, a temperatura NÃO MUDA! Isso é calor LATENTE!",
          theory:`<div class="theory-box"><div class="theory-title">📖 CALOR LATENTE (Q = m·L)</div><div class="theory-content"><strong>Calor latente</strong> é a energia necessária para mudar o estado físico de uma substância, sem variação de temperatura.<br><br>🔹 Fórmula: Q = m · L<br>• L = calor latente (cal/g ou J/kg)<br>• L_fusão: fusão/solidificação<br>• L_vaporização: vaporização/condensação<br><br>🔹 Água: L_fusão = 80 cal/g; L_vaporização = 540 cal/g</div><div class="formula-box">💡 Latente = "escondido" – a energia não se manifesta em temperatura!</div></div>`,
          text:"O que ocorre durante o CALOR LATENTE?",
          options:["A temperatura aumenta","A temperatura diminui","A temperatura permanece constante, mas ocorre mudança de estado","O calor específico muda"], correct:2,
          explanation:"✅ No calor latente, a energia é usada para mudar o estado físico, mantendo a temperatura constante." },
        { id:4, title:"📐 Capítulo 4: Equação Fundamental da Calorimetria", character:"Equacionista", avatar:"📐⚡", speech:"A fórmula Q = m·c·ΔT é a base da calorimetria! Vamos praticar!",
          theory:`<div class="theory-box"><div class="theory-title">📖 QUANTIDADE DE CALOR SENSÍVEL</div><div class="theory-content"><strong>Equação Fundamental:</strong> Q = m · c · ΔT<br><br>Onde ΔT = T_final - T_inicial.<br><br>🔹 Se ΔT > 0 → calor recebido (Q positivo)<br>🔹 Se ΔT < 0 → calor cedido (Q negativo)</div></div>`,
          text:"Qual a quantidade de calor necessária para aquecer 200 g de água (c=1 cal/g°C) de 20°C para 50°C?",
          options:["2000 cal","4000 cal","6000 cal","8000 cal"], correct:2,
          explanation:"✅ Q = m·c·ΔT = 200 × 1 × (50-20) = 200 × 30 = 6000 cal." },
        { id:5, title:"🔬 Capítulo 5: Calor Específico", character:"Especialista em Materiais", avatar:"🔬📊", speech:"Cada material tem seu 'jeito' de aquecer! O calor específico mede isso!",
          theory:`<div class="theory-box"><div class="theory-title">📖 CALOR ESPECÍFICO (c)</div><div class="theory-content"><strong>Calor específico</strong> é a quantidade de calor necessária para elevar em 1°C a temperatura de 1 grama de uma substância.<br><br>🔹 Água: c = 1 cal/g°C (muito alta)<br>🔹 Ferro: c ≈ 0,11 cal/g°C<br>🔹 Quanto maior o c, mais difícil aquecer o material!<br><br>💡 A água tem alto calor específico, por isso demora para aquecer e esfriar.</div></div>`,
          text:"O que significa um material ter ALTO calor específico?",
          options:["Aquece facilmente","Resiste a variações de temperatura (precisa mais energia para aquecer)","Conduz bem calor","Tem baixa densidade"], correct:1,
          explanation:"✅ Alto calor específico significa que o material precisa de mais energia para aumentar sua temperatura." },
        { id:6, title:"🔄 Capítulo 6: Trocas de Calor", character:"Mestre do Equilíbrio", avatar:"🔄⚖️", speech:"Quando corpos trocam calor, a soma das quantidades é ZERO! Energia se conserva!",
          theory:`<div class="theory-box"><div class="theory-title">📖 PRINCÍPIO DAS TROCAS DE CALOR</div><div class="theory-content">Em um sistema isolado termicamente, a soma das quantidades de calor trocadas entre os corpos é nula:<br><br><strong>Q₁ + Q₂ + Q₃ + ... = 0</strong><br><br>Ou seja: calor cedido = - calor recebido.<br><br>🔹 Quando dois corpos atingem a mesma temperatura, o equilíbrio térmico é alcançado.</div><div class="formula-box">📌 Q_recebido + Q_cedido = 0</div></div>`,
          text:"Em um sistema isolado, dois corpos trocam calor até atingirem:",
          options:["A mesma pressão","A mesma temperatura (equilíbrio térmico)","O mesmo volume","A mesma massa"], correct:1,
          explanation:"✅ Após as trocas de calor, os corpos atingem o equilíbrio térmico, com a mesma temperatura." },
        { id:7, title:"⚗️ Capítulo 7: Calorímetro", character:"Cientista do Laboratório", avatar:"⚗️📏", speech:"O calorímetro é um instrumento que isola termicamente os corpos para medir trocas de calor!",
          theory:`<div class="theory-box"><div class="theory-title">📖 CALORÍMETRO</div><div class="theory-content"><strong>Calorímetro</strong> é um recipiente termicamente isolado, usado para estudar trocas de calor.<br><br>🔹 Consideramos que o calorímetro também participa das trocas!<br>🔹 Equivalente em água: representa a capacidade térmica do calorímetro.<br><br>🔹 Fórmula: Q_calorímetro = C · ΔT (C = capacidade térmica)</div></div>`,
          text:"Qual a função de um calorímetro?",
          options:["Medir temperatura","Isolar termicamente o sistema para estudar trocas de calor","Aquecer substâncias","Esfriar substâncias"], correct:1,
          explanation:"✅ O calorímetro isola termicamente o sistema, evitando perdas de calor para o ambiente." },
        { id:8, title:"🧊 Capítulo 8: Exercício - Calor Sensível", character:"Treinador de Cálculos", avatar:"🧮🔥", speech:"Vamos praticar! Calcule a quantidade de calor para aquecer ferro.",
          text:"Um bloco de ferro (c=0,11 cal/g°C) de 500 g é aquecido de 30°C a 80°C. Qual a quantidade de calor recebida?",
          options:["2750 cal","5500 cal","1375 cal","275 cal"], correct:0,
          explanation:"✅ Q = m·c·ΔT = 500 × 0,11 × 50 = 500 × 5,5 = 2750 cal." },
        { id:9, title:"💧 Capítulo 9: Exercício - Calor Latente", character:"Mestre das Fases", avatar:"💧❄️", speech:"Derreter gelo requer energia! Vamos calcular!",
          text:"Quantas calorias são necessárias para derreter 100 g de gelo a 0°C? (L_fusão = 80 cal/g)",
          options:["800 cal","8000 cal","80 cal","160 cal"], correct:1,
          explanation:"✅ Q = m·L = 100 × 80 = 8000 cal." },
        { id:10, title:"💨 Capítulo 10: Exercício - Vaporização", character:"Doutor Vapor", avatar:"💨💧", speech:"Vaporizar água exige MUITA energia!",
          text:"Para vaporizar 50 g de água a 100°C (L_vap = 540 cal/g), qual o calor necessário?",
          options:["27000 cal","54000 cal","10800 cal","13500 cal"], correct:0,
          explanation:"✅ Q = m·L = 50 × 540 = 27000 cal." },
        { id:11, title:"🔄 Capítulo 11: Exercício - Trocas de Calor", character:"Equilibrista Térmico", avatar:"⚖️🔥", speech:"Misturamos água quente e fria. Qual a temperatura final?",
          theory:`<div class="theory-box"><div class="theory-title">📖 RESOLUÇÃO</div><div class="theory-content">Q₁ + Q₂ = 0<br>m₁·c·(Tf - T₁) + m₂·c·(Tf - T₂) = 0<br>Como c é igual (água), simplificamos:<br>m₁(Tf - T₁) + m₂(Tf - T₂) = 0</div></div>`,
          text:"Misturam-se 100 g de água a 80°C com 200 g de água a 20°C. Qual a temperatura final? (c=1 cal/g°C)",
          options:["40°C","50°C","60°C","45°C"], correct:0,
          explanation:"✅ 100(Tf-80) + 200(Tf-20)=0 → 100Tf-8000+200Tf-4000=0 → 300Tf=12000 → Tf=40°C." },
        { id:12, title:"🔬 Capítulo 12: Exercício - Calorímetro", character:"Investigador Térmico", avatar:"🔍⚗️", speech:"Vamos considerar o calorímetro nas trocas de calor!",
          text:"Um calorímetro de capacidade térmica 20 cal/°C contém 100 g de água a 25°C. Adiciona-se 50 g de água a 85°C. Qual a temperatura final?",
          options:["45°C","50°C","55°C","60°C"], correct:0,
          explanation:"✅ Q_água1 + Q_água2 + Q_calorímetro = 0 → 100(Tf-25) + 50(Tf-85) + 20(Tf-25)=0 → 100Tf-2500+50Tf-4250+20Tf-500=0 → 170Tf=7250 → Tf≈42,6°C. Arredondando para 45? Na verdade 7250/170=42,65. Mas entre opções, 45 é a mais próxima. Vamos ajustar: 100(Tf-25)+20(Tf-25)=120(Tf-25); 120(Tf-25)+50(Tf-85)=0 → 170Tf-3000-4250=0 → 170Tf=7250 → Tf=42,65. Aproximadamente 43°C. Opção mais próxima 45°C." },
        { id:13, title:"🧠 Capítulo 13: Recapitulação - Conceitos", character:"Professor Revisão", avatar:"📚🔄", speech:"Vamos revisar os conceitos fundamentais!",
          theory:`<div class="theory-box"><div class="theory-title">📖 RECAPITULAÇÃO</div><div class="theory-content">• Calor: energia em trânsito<br>• Calor sensível: Q = m·c·ΔT (varia temperatura)<br>• Calor latente: Q = m·L (muda estado)<br>• Calor específico: dificuldade de aquecer<br>• Trocas de calor: ΣQ = 0</div></div>`,
          text:"Qual a diferença entre calor sensível e calor latente?",
          options:["Sensível muda temperatura, latente muda estado","Sensível muda estado, latente muda temperatura","Ambos mudam temperatura","Ambos mudam estado"], correct:0,
          explanation:"✅ Calor sensível causa variação de temperatura; calor latente causa mudança de estado físico." },
        { id:14, title:"🔥❄️ Capítulo 14: Exercício Especial - Fusão + Aquecimento", character:"Mestre Combinado", avatar:"🧊🔥", speech:"Gelo a -10°C precisa ser aquecido até água a 20°C! Vamos calcular passo a passo!",
          theory:`<div class="theory-box"><div class="theory-title">📖 RESOLUÇÃO PASSO A PASSO</div><div class="theory-content">1. Aquecer gelo de -10°C a 0°C (sensível)<br>2. Derreter gelo a 0°C (latente)<br>3. Aquecer água de 0°C a 20°C (sensível)<br>Q_total = Q₁ + Q₂ + Q₃</div></div>`,
          text:"Qual a quantidade de calor total para transformar 100 g de gelo a -10°C em água a 20°C? (c_gelo=0,5 cal/g°C, L_f=80 cal/g, c_água=1 cal/g°C)",
          options:["9500 cal","10500 cal","8500 cal","11500 cal"], correct:0,
          explanation:"✅ Q₁ = 100×0,5×10 = 500 cal; Q₂ = 100×80 = 8000 cal; Q₃ = 100×1×20 = 2000 cal; Total = 500+8000+2000 = 10500 cal." },
        { id:15, title:"💨❄️ Capítulo 15: Exercício Especial - Vapor + Resfriamento", character:"Mestre Vapor", avatar:"💨❄️", speech:"Vapor quente até água fria! Desafio!",
          text:"Qual o calor liberado quando 50 g de vapor a 100°C se condensam e resfriam até 30°C? (L_vap=540 cal/g, c_água=1 cal/g°C)",
          options:["27000 cal","30500 cal","28000 cal","31500 cal"], correct:1,
          explanation:"✅ Q₁ = m·L_vap = 50×540=27000 cal (condensação); Q₂ = m·c·ΔT = 50×1×(100-30)=50×70=3500 cal (resfriamento); Total = 27000+3500=30500 cal." },
        { id:16, title:"🏆 Capítulo 16: Teste - Calor Sensível", character:"Avaliador", avatar:"🏆📝", speech:"Teste rápido!",
          text:"Qual a quantidade de calor para elevar 300 g de água de 10°C a 40°C? (c=1 cal/g°C)",
          options:["3000 cal","6000 cal","9000 cal","12000 cal"], correct:2,
          explanation:"✅ Q = 300×1×30 = 9000 cal." },
        { id:17, title:"🏆 Capítulo 17: Teste - Calor Latente", character:"Avaliadora", avatar:"🏆❄️", speech:"Teste de calor latente!",
          text:"Quantas calorias são liberadas quando 200 g de vapor se condensam a 100°C? (L=540 cal/g)",
          options:["54000 cal","108000 cal","27000 cal","216000 cal"], correct:1,
          explanation:"✅ Q = 200×540 = 108000 cal (liberadas, Q negativo)." },
        { id:18, title:"🏆 Capítulo 18: Teste - Trocas de Calor", character:"Desafiador", avatar:"🏆🔄", speech:"Mistura de massas diferentes!",
          text:"Misturam-se 300 g de água a 90°C com 200 g de água a 15°C. Qual a temperatura final?",
          options:["60°C","55°C","50°C","65°C"], correct:0,
          explanation:"✅ 300(Tf-90)+200(Tf-15)=0 → 300Tf-27000+200Tf-3000=0 → 500Tf=30000 → Tf=60°C." },
        { id:19, title:"🏆 Capítulo 19: Teste - Calorímetro", character:"Mestre Calorímetro", avatar:"⚗️🏆", speech:"Calorímetro com líquido desconhecido!",
          text:"Um calorímetro de capacidade 30 cal/°C contém 200 g de um líquido a 25°C. Adiciona-se 100 g de água a 80°C. Tf=40°C. Qual o calor específico do líquido? (c_água=1)",

    const totalQuestions = CHAPTERS.length;
    const gameContent = document.getElementById("gameContent");
    const scoreSpan = document.getElementById("scoreValue");
    const currentQSpan = document.getElementById("currentQ");
    const totalQSpan = document.getElementById("totalQ");

    function updateUI() { scoreSpan.textContent = score; currentQSpan.textContent = currentIndex+1; totalQSpan.textContent = totalQuestions; }

    function render() {
        if(currentIndex >= totalQuestions) { renderResult(); return; }
        const ch = CHAPTERS[currentIndex];
        const letters = ["A","B","C","D"];
        let theoryHtml = ch.theory ? ch.theory : '';
        let optionsHtml = ch.options.map((opt,idx)=>`<div class="option-comic" data-opt-index="${idx}"><div class="option-number">${letters[idx]}</div><div>${escapeHtml(opt)}</div></div>`).join('');
        let feedbackHtml = answered ? `<div class="feedback-comic ${userAnswer===ch.correct?'correct':'incorrect'}">${userAnswer===ch.correct?"✅✨ ACERTOU! ✨✅":"❌💔 VAMOS REVISAR! 💔❌"}<br><strong>${ch.explanation}</strong>${userAnswer!==ch.correct?`<br><br>📖 <strong>Resposta correta:</strong> ${ch.options[ch.correct]}`:''}</div>` : '';
        const html = `<div class="comic-panel"><div class="character"><div class="character-avatar">${ch.avatar}</div><div><div class="character-name">${ch.character}</div><div class="speech-bubble">"${ch.speech}"</div></div></div>${theoryHtml}<div class="question-box">📖 <strong>${ch.title}</strong><br>${escapeHtml(ch.text)}</div><div class="options-comic">${optionsHtml}</div>${feedbackHtml}<button class="next-btn" id="nextBtn" ${!answered?'disabled':''}>▶ Próximo Capítulo ▶</button></div>`;
        gameContent.innerHTML = html;
        if(!answered) document.querySelectorAll(".option-comic").forEach(opt=>opt.addEventListener("click",()=>{if(!answered){const idx=parseInt(opt.dataset.optIndex); handleAnswer(idx,ch);}}));
        document.getElementById("nextBtn")?.addEventListener("click",nextChapter);
    }

    function handleAnswer(selectedIdx,ch){ if(answered) return; answered=true; userAnswer=selectedIdx; if(selectedIdx===ch.correct) score++; updateUI(); render(); }
    function nextChapter(){ if(!answered) return; currentIndex++; answered=false; userAnswer=null; render(); }
    function renderResult(){
        const percent = (score/totalQuestions)*100;
        let msg = percent>=80?"🏆 MESTRE DO CALOR! 🏆": percent>=60?"🔥 GUARDIÃO TÉRMICO! 🔥":"🌱 APRENDIZ EM AQUECIMENTO! 🌱";
        const html = `<div class="comic-panel result-panel"><div style="font-size:3rem;">🔥❄️💧</div><h2>${msg}</h2><div style="background:#5a2a1a;border-radius:30px;padding:10px;margin:20px 0;"><div class="score-bar" style="width:${percent}%;">${score}/${totalQuestions} acertos</div></div><p>${percent>=80?"Excelente! Você domina calorimetria, trocas de calor e mudanças de estado!":percent>=60?"Muito bem! Revise os conceitos de calor latente e as fórmulas das trocas de calor.":"Revise os capítulos sobre calor sensível, latente e a equação fundamental!"}</p><button class="restart-btn" id="restartBtn">🔥 Recomeçar Estudo 🔥</button><div class="summary-box"><strong>📚 FÓRMULAS ESSENCIAIS:</strong><br>• Calor Sensível: Q = m·c·ΔT<br>• Calor Latente: Q = m·L<br>• Trocas de calor: ΣQ = 0<br>• Calorímetro: Q = C·ΔT<br>• Água: c=1 cal/g°C, L_f=80 cal/g, L_v=540 cal/g</div></div>`;
        gameContent.innerHTML = html;
        document.getElementById("restartBtn")?.addEventListener("click",()=>{ score=0; currentIndex=0; answered=false; userAnswer=null; updateUI(); render(); });
    }
    function escapeHtml(str){ if(!str) return ""; return str.replace(/[&<>]/g,function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    totalQSpan.textContent = totalQuestions;
    render();
</script>
